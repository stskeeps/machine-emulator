[package]
name = "cartesi-replay"
version = "0.1.0"
edition = "2021"

[dependencies]
utralib = { version = "0.1.27", optional = true, default-features = false }
sha2 = { version = "0.10", default-features = false }
tiny-keccak = { version = "2", features = ["keccak"] }
xous = "0.9.70"
log-server = { package = "xous-api-log", version = "0.1.69" }
log = "0.4"
usb-bao1x = { git = "https://github.com/betrusted-io/xous-core", rev = "afa89859512d17bc7a01e192d471cb6678f067ba" }
bao1x-hal = { features = ["std"], optional = true, git = "https://github.com/betrusted-io/xous-core", rev = "afa89859512d17bc7a01e192d471cb6678f067ba" }
bao1x-hal-service = { optional = true, git = "https://github.com/betrusted-io/xous-core", rev = "afa89859512d17bc7a01e192d471cb6678f067ba" }
getrandom = "=0.2.12"

[patch.crates-io.getrandom]
git = "https://github.com/betrusted-io/xous-core"
rev = "afa89859512d17bc7a01e192d471cb6678f067ba"

[build-dependencies]
serde_json = "1"
zip = "2"
ureq = "2"
cc = "1"

[features]
bao1x = ["utralib/bao1x", "usb-bao1x/bao1x"]
board-dabao = [
    "bao1x-hal/board-dabao",
    "bao1x-hal-service/board-dabao",
    "usb-bao1x/board-dabao",
]
board-baosec = ["usb-bao1x/board-baosec"]
hosted-baosec = ["usb-bao1x/hosted-baosec"]
default = []

# Keep this standalone checkout out of a surrounding xous-core workspace.
[workspace]
